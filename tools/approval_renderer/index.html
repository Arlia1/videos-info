<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bailapp 3D — Renders de Aprobación</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #FFF5F8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #container {
      position: relative;
      width: 1080px;
      height: 1920px;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      display: block;
    }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="webgl" width="1080" height="1920"></canvas>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
