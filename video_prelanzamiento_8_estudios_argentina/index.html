<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bailapp — Video Pre-Lanzamiento</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #1C191D;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #stage-container {
      position: relative;
      width: 1080px;
      height: 1920px;
      transform-origin: center center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      border-radius: 24px;
      overflow: hidden;
      background: #FFF5F8;
    }
    #webgl {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      display: block;
      z-index: 1;
    }
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      display: block;
      z-index: 2;
      pointer-events: none;
    }
    @media (min-width: 1080px) and (min-height: 1920px) {
      body {
        margin: 0 !important;
        padding: 0 !important;
        background: transparent !important;
        justify-content: flex-start !important;
        align-items: flex-start !important;
      }
      #stage-container {
        transform: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        top: 0 !important;
        left: 0 !important;
      }
    }
  </style>
</head>
<body>
  <div id="stage-container">
    <canvas id="webgl" width="1080" height="1920"></canvas>
    <canvas id="ui" width="1080" height="1920"></canvas>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
