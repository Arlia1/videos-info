<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bailapp - Bailarina de Heels (Humaaans Modular Rig con Tacos Stiletto)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 600px;
      height: 900px;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg {
      width: 560px;
      height: 860px;
      overflow: visible;
    }
  </style>
</head>
<body>

  <!-- STANDALONE HEELS DANCER (RIG HUMAAANS 100% COHESIVO CON LOS OTROS MODELOS) -->
  <svg viewBox="0 0 350 480" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Sombra suave idéntica a los otros 4 modelos -->
      <filter id="characterShadowHeels" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#C2185B" flood-opacity="0.14"/>
      </filter>
      <!-- Sombra de contacto en el piso para tacos -->
      <radialGradient id="floorGradHeels" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#3D1D30" stop-opacity="0.32"/>
        <stop offset="100%" stop-color="#3D1D30" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- Sombra en el suelo bajo los tacos y almohadillas de los pies -->
    <ellipse cx="175" cy="450" rx="125" ry="15" fill="url(#floorGradHeels)"/>

    <!-- Estructura Humaaans idéntica a Modelos 1, 2, Urbano y Ballet -->
    <g id="a-standing-human" transform="translate(30, 15)" filter="url(#characterShadowHeels)">

      <!-- ================= 1. BOTTOM: PIERNAS ESBELTAS DE HEELS EN CALZAS NEGRAS Y TACOS STILETTO ================= -->
      <!-- Pose: Strut / Caminata icónica de Heels Dance en calzas ceñidas de danza -->
      <g id="BOTTOM" transform="translate(0, 187)">

        <!-- PIERNA TRASERA (Apoyo firme) -->
        <polygon id="Leg-Back" fill="#1C1826" points="128 0 176.08 127.22 209.78 221 229 221 182.67 0"/>

        <!-- TACO STILETTO TRASERO (Botín de danza con taco aguja en el suelo) -->
        <g id="Stiletto-Shoe-Back" transform="translate(204, 199)">
          <!-- Caña del botín ceñida al tobillo -->
          <path d="M 4,16 L 3,27 L 22,25 L 21,16 Z" fill="#181420"/>
          
          <!-- Empeine y puente arqueado del pie en taco -->
          <path d="M 3,27 C 9,28 17,29 27,37 L 46,40 L 59,37 C 56,33 46,25 32,20 C 26,18 22,17 19,16 Z" fill="#241E30"/>
          
          <!-- Suela en contacto con el suelo en la parte delantera (almohadilla y puntera) -->
          <path d="M 25,37 C 29,40 37,42 47,42 L 59,37 L 56,35 C 46,38 36,38 25,36 Z" fill="#D94680"/>

          <!-- HUECO VISIBLE DEL ARCO DEL TACO (Negative space beneath arch) -->
          <!-- Entre el taco fino y la almohadilla delantera hay espacio libre elevado -->
          
          <!-- TACO AGUJA FINO (Stiletto Stem de 9cm) -->
          <path d="M 4,27 L 3.5,41 L 7.5,41 L 7,27 Z" fill="#120F18"/>
          <!-- Detalle metálico en la espiga del taco -->
          <line x1="5.5" y1="28" x2="5" y2="41" stroke="#F48FB1" stroke-width="1"/>
          <!-- Tapita del taco en contacto con el piso -->
          <rect x="3" y="41" width="5" height="1.8" rx="0.6" fill="#E06385"/>

          <!-- Línea estética de cierre / costura del botín -->
          <line x1="11" y1="18" x2="24" y2="33" stroke="#E06385" stroke-width="1.2" stroke-dasharray="2 1.5"/>
        </g>

        <!-- PIERNA DELANTERA (Paso / Strut hacia adelante en calzas ceñidas) -->
        <path id="Leg-Front" d="M116.11,0 C115.59,43.65 115.97,102.42 114.75,105.14 C113.94,106.96 88.69,127.63 39,167.15 L48.9,184 C107.89,145.95 138.9,124.39 141.92,119.33 C146.44,111.72 169.17,41.76 181,0 L116.11,0 Z" fill="#2B2438"/>

        <!-- TACO STILETTO DELANTERO (Inclinado con la pierna delantera en avance) -->
        <g id="Stiletto-Shoe-Front" transform="translate(56.5, 189) rotate(50) translate(-56.5, -189) translate(22, 169)">
          <!-- Caña del botín -->
          <path d="M 4,16 L 3,27 L 22,25 L 21,16 Z" fill="#181420"/>
          
          <!-- Empeine y puente arqueado del pie en taco -->
          <path d="M 3,27 C 9,28 17,29 27,37 L 46,40 L 59,37 C 56,33 46,25 32,20 C 26,18 22,17 19,16 Z" fill="#352C45"/>
          
          <!-- Suela y puntera fina -->
          <path d="M 25,37 C 29,40 37,42 47,42 L 59,37 L 56,35 C 46,38 36,38 25,36 Z" fill="#D94680"/>

          <!-- Taco aguja fino (Stiletto) -->
          <path d="M 4,27 L 3.5,41 L 7.5,41 L 7,27 Z" fill="#120F18"/>
          <line x1="5.5" y1="28" x2="5" y2="41" stroke="#F48FB1" stroke-width="1"/>
          <rect x="3" y="41" width="5" height="1.8" rx="0.6" fill="#E06385"/>

          <line x1="11" y1="18" x2="24" y2="33" stroke="#E06385" stroke-width="1.2" stroke-dasharray="2 1.5"/>
        </g>
      </g>


      <!-- ================= 2. TORSO: TOP CEÑIDO DE CLASE DE HEELS & BRAZOS EN POSE ================= -->
      <g id="TORSO" transform="translate(22, 82)">
        <!-- Brazos en piel natural (proporciones exactas de Humaaans) -->
        <path id="Skin-Arms" d="M158.64,42.7 L193.35,23.69 C199.12,16.84 204.81,11.51 210.41,7.72 C212.12,7.01 215.11,6.57 212.31,11.54 C209.52,16.51 206.79,21.86 208.22,23.39 C209.65,24.92 213.2,22.79 214.9,25.33 C216.04,27.02 209.96,29.7 196.68,33.37 L171.46,56.46 L158.64,42.7 Z M213,58.74 L228.25,50.36 C230.39,42.22 232.94,38.13 235.92,38.08 C238.2,37.01 234.22,47.3 238.56,46.41 C242.89,45.52 253.46,37.65 255.29,39.25 C257.98,41.61 255.58,48.86 252.75,52.47 C247.45,59.22 243.07,61.52 232.24,64.54 C226.57,66.12 220.45,69.29 213.87,74.04 L213,58.74 Z" fill="#F2C8B0"/>

        <!-- Top Ceñido Negro de Heels (Manga corta estilizada / body de baile) -->
        <path id="Sleeve-Right" d="M142.86,34.75 C154.89,36.53 171.3,36.53 190.1,28.39 L194.44,44.41 C180.81,54.24 162.71,61.23 148.29,58.52 C136.92,56.4 133.27,41.66 142.86,34.75 Z" fill="#1C1822" transform="translate(165.9, 43.75) rotate(-9) translate(-165.9, -43.75)"/>
        
        <path id="Top-Body" d="M158.1,62.76 C171.01,65.98 192.65,62.18 223.04,51.37 C230.57,66.96 234.06,78.08 233.49,84.72 C207.42,98.33 185.09,104.4 166.68,104.8 C167.27,115.72 165.94,126.11 161.47,135.61 C152.29,155.12 98.55,137.05 80.47,140.61 C69.16,103.85 91.04,88.91 91.06,65.4 C91.07,39.64 111.75,0 114.8,0 L142.54,0 C144.07,19.67 151.78,41.35 158.1,62.76 Z" fill="#241E2C"/>

        <!-- Smartphone en la mano (Gestualidad aprobada de los modelos) -->
        <g id="Hand-Phone" transform="translate(230, 15) scale(0.65)">
          <rect x="0" y="0" width="45" height="75" rx="8" fill="#1C1820" stroke="#FFFFFF" stroke-width="2"/>
          <rect x="4" y="5" width="37" height="63" rx="5" fill="#FFF0F5"/>
          <rect x="16" y="8" width="14" height="3" rx="1.5" fill="#1C1820"/>
          <rect x="8" y="18" width="22" height="5" rx="2" fill="#F48FB1"/>
          <rect x="14" y="27" width="23" height="5" rx="2" fill="#E06385"/>
          <rect x="8" y="36" width="25" height="5" rx="2" fill="#F48FB1"/>
        </g>
      </g>


      <!-- ================= 3. HEAD: CABELLO LARGO ONDULADO SUELTO (SIN COLETA) ================= -->
      <g id="HEAD" transform="translate(82, 0)">
        <!-- Piel y rostro Humaaans -->
        <g id="Head-Skin" transform="translate(54, 31)" fill="#F2C8B0">
          <path d="M8.26,34.49 C3.65,29.08 0.54,22.45 1.06,15.03 C2.56,-6.38 32.35,-1.67 38.14,9.13 C43.94,19.94 43.25,47.33 35.76,49.26 C32.77,50.03 26.41,48.15 19.94,44.24 L24,73 L0,73 L8.26,34.49 Z"/>
          <!-- Aro / pendiente en rosa frambuesa -->
          <circle cx="28" cy="40" r="3" fill="#E06385"/>
        </g>

        <!-- Cabello ondulado voluminoso suelto castaño oscuro (rig Humaaans Wavy) -->
        <path id="Hair-Wavy" d="M94.41,44.98 C94.17,43.58 93.59,42.03 93.12,40.7 C92.52,39 91.6,37.46 90.6,36.01 C88.7,33.27 86.43,30.81 83.92,28.76 C79.33,25.02 73.5,22.86 67.76,23.56 C64.86,23.92 62.05,25.02 59.65,26.86 C57.49,28.52 55.41,30.97 52.61,31.15 C49.56,31.34 46.77,28.65 44.32,26.99 C41.57,25.11 38.63,23.75 35.41,23.22 C30.02,22.33 24.95,24.15 21.23,28.58 C17.27,33.29 14.4,40.2 16.99,46.44 C17.48,47.6 18.1,48.58 18.99,49.39 C19.81,50.14 21.06,50.93 21.39,52.11 C21.74,53.38 20.69,55.01 20.28,56.15 C19.7,57.78 19.22,59.49 19.39,61.27 C19.67,64.18 21.5,66.96 23.43,68.88 C25.4,70.83 27.82,71.94 30.41,72.46 C32.14,72.8 33.9,72.99 35.66,72.86 C36.53,72.8 37.3,72.56 38.14,72.36 C38.96,72.18 39.42,72.39 40.12,72.85 C43.35,74.94 46.83,75.75 50.57,75.44 C53.72,75.17 57.36,74.41 59.93,72.25 C62.79,69.85 62.73,66.54 62.06,63 C62.77,63.36 64.74,63.58 63.56,62.17 C63.1,61.61 62.22,61.38 61.62,61.06 C60.92,60.67 60.21,60.18 59.67,59.56 C57.49,57.05 59.69,51.93 62.44,51.09 C66.52,49.83 67.43,55.61 70.35,57.1 C72.02,57.96 73.77,56.78 75.03,55.59 C76.71,53.98 77.86,51.86 78.84,49.69 C79.66,47.91 80.42,46.1 81.25,44.33 C81.64,43.5 82.98,41.16 82.3,40.23 C85.23,39.64 88.48,40.86 91,42.45 C92.04,43.11 92.83,43.84 93.39,45 C93.51,45.25 93.76,45.99 94.09,46.02 C94.69,46.07 94.47,45.34 94.41,44.98" fill="#281A14"/>
      </g>

    </g>
  </svg>

</body>
</html>
