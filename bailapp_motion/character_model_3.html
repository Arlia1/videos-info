<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1920px;
    background: linear-gradient(180deg, #FFF5F8 0%, #FDEBF2 35%, #FBD4E3 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .bg-panel {
    position: absolute;
    top: 150px;
    width: 950px;
    height: 1420px;
    border-radius: 475px 475px 40px 40px;
    background: linear-gradient(180deg, #FFFFFF 0%, #FFF7FA 55%, rgba(254, 237, 244, 0.45) 100%);
    border: 3px solid rgba(255, 255, 255, 0.95);
    box-shadow: 0 35px 80px rgba(224, 99, 133, 0.12);
    z-index: 1;
  }

  .studio-sunbeam {
    position: absolute;
    top: 190px;
    right: 70px;
    width: 400px;
    height: 650px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.75) 0%, rgba(255, 245, 248, 0) 70%);
    border-radius: 30px;
    transform: rotate(6deg);
    pointer-events: none;
    z-index: 2;
  }

  .header-badge {
    position: absolute;
    top: 100px;
    display: flex;
    align-items: center;
    gap: 14px;
    background: #FFFFFF;
    padding: 16px 38px;
    border-radius: 100px;
    box-shadow: 0 10px 30px rgba(224, 99, 133, 0.15);
    border: 2px solid #FAD2E1;
    z-index: 10;
  }
  .header-badge .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #E06385;
    box-shadow: 0 0 14px #E06385;
  }
  .header-badge span {
    font-size: 24px;
    font-weight: 800;
    color: #3D2D3B;
    letter-spacing: 0.6px;
  }

  /* LEFT SIDE FLOATING CARDS */
  .cards-column {
    position: absolute;
    top: 250px;
    left: 80px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    z-index: 10;
    width: 420px;
  }

  .floating-card {
    background: #FFFFFF;
    border-radius: 24px;
    padding: 20px 26px;
    box-shadow: 0 16px 36px rgba(216, 27, 96, 0.09);
    display: flex;
    align-items: center;
    gap: 16px;
    border: 2px solid #FCE4EC;
  }

  .icon-bubble {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }
  .icon-bubble.grey { background: #F5EBF0; color: #8C7A87; }
  .icon-bubble.red { background: #FFEBEE; color: #E53935; }
  .icon-bubble.pink { background: #FFE4EC; color: #E06385; }

  .card-text .title {
    font-size: 21px;
    font-weight: 800;
    color: #382E39;
    margin-bottom: 4px;
    line-height: 1.25;
  }
  .card-text .subtitle {
    font-size: 16px;
    font-weight: 600;
    color: #9C8997;
  }

  /* CHARACTER STAGE */
  .character-stage {
    position: absolute;
    bottom: 370px;
    right: 50px;
    width: 540px;
    height: 1100px;
    z-index: 6;
  }

  .subtitle-safezone {
    position: absolute;
    bottom: 240px;
    width: 940px;
    text-align: center;
    z-index: 20;
    padding: 24px 36px;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(16px);
    border-radius: 36px;
    border: 2px solid #FAD2E1;
    box-shadow: 0 22px 55px rgba(74, 62, 77, 0.08);
  }

  .subtitle-text {
    font-size: 38px;
    font-weight: 900;
    line-height: 1.35;
    color: #2D242E;
  }

  .highlight-pink {
    color: #C2185B;
    background: #FCE4EC;
    padding: 2px 14px;
    border-radius: 14px;
    display: inline-block;
  }

  .app-preview-bar {
    position: absolute;
    bottom: 80px;
    width: 900px;
    background: #2D242E;
    color: #FFFFFF;
    padding: 22px 38px;
    border-radius: 100px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 20;
    box-shadow: 0 20px 45px rgba(45, 36, 46, 0.22);
  }
  .app-preview-bar .logo-name {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .app-preview-bar .cta-pill {
    background: #F8BBD0;
    color: #880E4F;
    font-size: 20px;
    font-weight: 800;
    padding: 14px 32px;
    border-radius: 50px;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>

  <div class="bg-panel"></div>
  <div class="studio-sunbeam"></div>

  <!-- Header Badge en español -->
  <div class="header-badge">
    <div class="dot"></div>
    <span>LA REALIDAD DE BUSCAR CLASES</span>
  </div>

  <!-- Tarjetas flotantes a la izquierda -->
  <div class="cards-column">
    <div class="floating-card">
      <div class="icon-bubble grey">💬</div>
      <div class="card-text">
        <div class="title">"¿Tienen cupos en Heels?"</div>
        <div class="subtitle">Visto hace 3 días · Sin respuesta</div>
      </div>
    </div>

    <div class="floating-card">
      <div class="icon-bubble red">⚠️</div>
      <div class="card-text">
        <div class="title">"Solo nivel profesional"</div>
        <div class="subtitle">Vos querías nivel inicial...</div>
      </div>
    </div>

    <div class="floating-card">
      <div class="icon-bubble pink">📍</div>
      <div class="card-text">
        <div class="title">A 2 horas de tu casa</div>
        <div class="subtitle">Un martes a las 14:00 hs 🙃</div>
      </div>

        </g>
      </g>
    </svg>
  </div>

  <!-- Subtítulo en Safe Zone (38% desde la base) -->
  <div class="subtitle-safezone">
    <div class="subtitle-text">
      ¿Cansada de mandar <span class="highlight-pink">10 DMs</span> y que nadie conteste?
    </div>
  </div>

  <!-- Barra inferior con 'Bailapp' todo junto -->
  <div class="app-preview-bar">
    <div class="logo-name">
      🩰 Bailapp
    </div>
    <div class="cta-pill">RESERVÁ TU CLASE YA</div>
  </div>

</body>
</html>
