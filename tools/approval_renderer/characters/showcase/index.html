<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bailapp 3D — Character Model Approval Showcase</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #181519;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #stage-container {
      position: relative;
      width: 1080px;
      height: 1920px;
      background: #FFF5F8;
    }
    #webgl {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      display: block;
      z-index: 1;
    }
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      display: block;
      z-index: 2;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="stage-container">
    <canvas id="webgl" width="1080" height="1920"></canvas>
    <canvas id="ui" width="1080" height="1920"></canvas>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
