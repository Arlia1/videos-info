<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bailapp Reel — Encontrá tu Clase de Danza en un Toque</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #1C191D;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #stage-container {
      position: relative;
      width: 1080px;
      height: 1920px;
      transform-origin: center center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      border-radius: 24px;
      overflow: hidden;
      background: #FFF5F8;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      display: block;
    }

    /* Player Controls Bar for previewing */
    #controls-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(35, 30, 36, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 12px 24px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 16px;
      color: #FFF;
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    #controls-bar button {
      background: #E06385;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    #controls-bar button:hover {
      background: #D81B60;
      transform: translateY(-1px);
    }

    #controls-bar button.secondary {
      background: rgba(255, 255, 255, 0.12);
    }
    #controls-bar button.secondary:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    #time-slider {
      width: 240px;
      accent-color: #E06385;
      cursor: pointer;
    }

    #time-display {
      font-family: monospace;
      font-size: 14px;
      color: #E0DFE2;
      min-width: 110px;
    }

    /* Exact 1080x1920 capture override for headless video renderer */
    @media (min-width: 1080px) and (min-height: 1920px) {
      body {
        margin: 0 !important;
        padding: 0 !important;
        background: transparent !important;
        justify-content: flex-start !important;
        align-items: flex-start !important;
      }
      #controls-bar {
        display: none !important;
      }
      #stage-container {
        transform: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        top: 0 !important;
        left: 0 !important;
      }
    }
  </style>
</head>
<body>
  <div id="stage-container">
    <canvas id="c" width="1080" height="1920"></canvas>
  </div>

  <div id="controls-bar">
    <button id="btn-play">▶ Reproducir</button>
    <button id="btn-restart" class="secondary">↺ Reiniciar</button>
    <input type="range" id="time-slider" min="0" max="26.5" step="0.05" value="0" />
    <span id="time-display">00:00 / 00:26</span>
    <button id="btn-speed" class="secondary">1.0x</button>
    <button id="btn-sound" class="secondary">🔊 Sonido ON</button>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
