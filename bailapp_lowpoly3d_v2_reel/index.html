<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bailapp Reel — Enhanced Low-Poly 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #181519;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #stage-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    #stage-container {
      position: relative;
      width: 1080px;
      height: 1920px;
      transform-origin: center center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      border-radius: 24px;
      overflow: hidden;
      background: #FFF5F8;
    }

    /* Canvas 3D WebGL (Capa 0 y 1) */
    #webgl {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      display: block;
      z-index: 1;
    }

    /* Canvas 2D UI (Capa 2, 3 y 4) */
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      display: block;
      z-index: 2;
      pointer-events: none;
    }

    #controls-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(35, 30, 36, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 12px 24px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 999;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    button {
      background: #E06385;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover { background: #D81B60; }
    button.secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #FFF;
    }
    button.secondary:hover { background: rgba(255, 255, 255, 0.2); }

    input[type="range"] {
      width: 280px;
      accent-color: #E06385;
      cursor: pointer;
    }

    #time-display {
      color: #E2D9E2;
      font-family: monospace;
      font-size: 14px;
      min-width: 95px;
    }

    @media (min-width: 1080px) and (min-height: 1920px) {
      body {
        margin: 0 !important;
        padding: 0 !important;
        background: transparent !important;
        justify-content: flex-start !important;
        align-items: flex-start !important;
      }
      #controls-bar {
        display: none !important;
      }
      #stage-container {
        transform: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        top: 0 !important;
        left: 0 !important;
      }
    }
  </style>
</head>
<body>
  <div id="stage-wrapper">
    <div id="stage-container">
      <canvas id="webgl" width="1080" height="1920"></canvas>
      <canvas id="ui" width="1080" height="1920"></canvas>
    </div>
  </div>

  <div id="controls-bar">
    <button id="btn-play">▶ Reproducir</button>
    <button id="btn-restart" class="secondary">↺ Reiniciar</button>
    <input id="time-slider" type="range" min="0" max="24.5" step="0.05" value="0" />
    <span id="time-display">00:00 / 00:24</span>
    <button id="btn-speed" class="secondary">1.0x</button>
    <button id="btn-sound" class="secondary">🔊 Sonido ON</button>
  </div>

  <script>
    function autoScale() {
      const container = document.getElementById('stage-container');
      if (!container) return;
      if (window.innerWidth >= 1080 && window.innerHeight >= 1920) {
        container.style.transform = 'none';
        return;
      }
      const scale = Math.min(
        (window.innerWidth - 32) / 1080,
        (window.innerHeight - 90) / 1920
      );
      container.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', autoScale);
    window.addEventListener('DOMContentLoaded', autoScale);
    autoScale();
  </script>

  <script type="module" src="main.js"></script>
</body>
</html>
